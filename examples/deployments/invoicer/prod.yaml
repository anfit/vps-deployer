name: invoicer-prod
host: prod

service:
  user: svc-invoicer

release:
  source: ${PROJECTS_DIR}/vps-deployer/examples/artifacts/invoicer.tar.gz

runtime:
  command: ./bin/invoicer
  working_directory: app
  restart: always

healthcheck:
  type: http
  url: http://127.0.0.1:8104/health

# Commit ordinary configuration directly. Use from_global only when a value is
# genuinely shared by multiple deployments.
environment:
  APP_ENV: production
  LOG_LEVEL: info
  TZ: Europe/Warsaw

# Secret values are never committed; apply resolves these explicit references
# from its local process environment.
secrets:
  DATABASE_URL:
    from_env: INVOICER_PROD_DATABASE_URL

storage:
  data:
    path: /var/lib/invoicer
